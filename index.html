<body>
    <h1>Mi primer RTS</h1>
    <canvas id="game" width="800" height="600"></canvas>
    <p class="hint">
        <b>Clic izquierdo</b> seleccionar ·
        <b>Arrastrar</b> caja de selección ·

        <b>Rueda</b> zoom
    </p>
