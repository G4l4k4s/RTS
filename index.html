<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primer RTS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mi primer RTS</h1>
    <canvas id="game" width="800" height="600"></canvas>
    <p class="hint">
        <b>Clic izquierdo</b> seleccionar · <b>Arrastrar</b> caja · <b>Shift</b> añadir ·
        <b>Clic derecho</b> mover / talar / atacar ·
        <b>B</b> cuartel · <b>T</b> torre ·
        <b>WASD</b> cámara · <b>Rueda</b> zoom ·
        <b>Minimapa</b> clic para saltar ·
        <b>Guardar / Cargar / Sonido</b> arriba
    </p>
    <script src="main.js"></script>
</body>
